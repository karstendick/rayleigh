# fly.toml - Fly.io deployment configuration
# See https://fly.io/docs/reference/configuration/

app = "rayleigh-feed"
# Northern Virginia, near Bluesky's Jetstream server:
primary_region = "iad"

[build]

[env]
  HOST = "0.0.0.0"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
